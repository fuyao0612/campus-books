name: Project checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: Check frontend syntax
        run: |
          node --check web/app.js
          node --check web/api.js
          node --check web/server.mjs
      - name: Build Linux server
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -o /tmp/campus-books .
